<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monopoly Board</title>

<style>
html,body{margin:0;padding:0;height:100%;width:100%;background:black;font-family:sans-serif;display:flex;overflow-x:hidden}#boardWrapper{width:15%;height:100%;display:flex;justify-content:center;align-items:center;background:black;overflow:hidden}
#boardWrapper{width:15%;height:100%;display:flex;justify-content:center;align-items:flex-start;background:black;overflow:visible}
#boardContainer{width:100%;height:auto;min-height:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;position:relative}
#board{position:relative;height:900px;width:900px}
#boardImg{width:100%;height:100%}
#centralDisplayContainer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:25px;z-index:10}
#displayContainer{display:flex;flex-direction:column;gap:15px;align-items:center;transform:translateY(-35px)}
.displayBox{padding:8px 14px;border-radius:12px;width:300px;text-align:center;font-weight:bold;font-size:22px;background:linear-gradient(135deg,#6a0dad,#00d4ff);color:white;box-shadow:0 0 12px #6a0dad,0 0 18px #00d4ff;word-wrap:break-word}
#propertyLink,#rulesLink{position:absolute;z-index:20}
#propertyLink img,#rulesLink img{width:75px;border-radius:8px;box-shadow:0 0 6px rgba(255,255,255,0.5)}
#propertyLink{top:40%;left:265px;transform:translateY(-50%)}#rulesLink{top:50%;right:560px;transform:translateY(-50%)}
.hotel,.house{width:29px;height:29px;position:absolute}
#topButtons{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;transform:translateY(-50px)}
.buttonRow{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;align-items:center;justify-content:center;width:100%}
.small-button{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#222;cursor:pointer;transform:translateY(-5px)}
.small-button img{width:100%;height:100%;object-fit:contain}
#topButtons{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;transform:translateY(-50px)}
.buttonRow{display:flex;flex-direction:row;flex-wrap:nowrap;gap:6px;align-items:center;justify-content:center;width:100%}
.small-button{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#222;cursor:pointer;transform:translateY(-5px)}
.small-button img{width:100%;height:100%;object-fit:contain}
.buttonRow:first-child .small-button{width:120px;height:120px}
.buttonRow:nth-child(2) .small-button{width:75px;height:75px}
.dot{width:12px;height:12px;border-radius:50%;position:absolute;z-index:30;border:2px solid black;box-shadow:0 0 1px 1px white}
#controlsContainer{width:85%;height:100%;background:#111;display:flex;flex-direction:column}
#controlsInner{display:flex;flex-direction:column;height:100%;padding:10px 0;box-sizing:border-box}
#chatFrame{flex-grow:1;width:100%;margin-top:15px;border:none;min-height:0}
#moneyContainer{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;justify-content:center;width:100%;padding:10px 0;box-sizing:border-box}
.moneyBox{width:100%;height:44px;padding:0 4px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;box-shadow:0 0 14px #00d4ff;color:white;box-sizing:border-box;white-space:nowrap}
.moneyBox.red{background:#ff4d4d}.moneyBox.blue{background:#3399ff}.moneyBox.orange{background:#ff8c1a;color:black}.moneyBox.green{background:limegreen;color:black}.moneyBox.purple{background:#8a2be2}.moneyBox.white{background:#eee;color:black}
.piece { width:32px; height:32px; border-radius:50%; position:absolute; display:flex; align-items:center; justify-content:center; font-weight:bold; border:3px solid transparent; box-shadow:0 0 6px rgba(0,0,0,0.4); transition:left 0.4s ease, top 0.4s ease; color:white; }
.red { background:#ff4d4d; border-color:#ff8080; }
.blue { background:#3399ff; border-color:#66a3ff; }
.orange { background:goldenrod; border-color:#ffde59; color:black; }
.green { background:limegreen; border-color:#aaffaa; color:black; }
.purple { background:#9933ff; border-color:#cc99ff; }
.white{background:#ffffff;border-color:#cccccc;color:black;}
.mode-btn{padding:6px 40px;font-size:.9em;border-radius:5px;border:1px solid #555;background:#111;color:#eee;cursor:pointer;text-align:center;transition:.2s}
.mode-btn.active{background:#0077ff;color:#fff;border-color:#00aaff}.mode-btn:hover{background:#333}
#modeToggle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-top:20px;z-index:60;position:relative}
.colorRow{display:flex;flex-wrap:nowrap;justify-content:center;gap:2px;overflow-x:auto;max-width:100%}
.modeRow{display:flex;justify-content:center;gap:14px}.white-btn.plus{background-color:#28a745!important;border:1px solid #1e7e34!important;color:white!important;padding:.1px .1px;border-radius:3px;font-weight:bold;cursor:pointer;}
.white-btn.plus{background-color:#28a745!important;border:1px solid #1e7e34!important;color:white!important;padding:10px 20px;font-size:1em;border-radius:5px;font-weight:bold;cursor:pointer;}
.white-btn.minus{background-color:#dc3545!important;border:1px solid #b02a37!important;color:white!important;padding:10px 20px;font-size:1em;border-radius:5px;font-weight:bold;cursor:pointer;}.white-btn.clr-brown { background-color:#7D4900 !important; border-color:#5c3600 !important; color:white !important; }
.white-btn.clr-dblue { background-color:#02497F !important; border-color:#01324f !important; color:white !important; }
.white-btn.clr-blue { background-color:#00BFF5 !important; border-color:#0090b8 !important; color:black !important; }
.white-btn.clr-green { background-color:#38B74C !important; border-color:#2a8a39 !important; color:white !important; }
.white-btn.clr-yellow { background-color:#FFEF03 !important; border-color:#c9bc00 !important; color:black !important; }
.white-btn.clr-pink { background-color:#ED008C !important; border-color:#b8006b !important; color:white !important; }
.white-btn.clr-orange { background-color:#F8941C !important; border-color:#c7740f !important; color:black !important; }
.white-btn.clr-red { background-color:#FE0000 !important; border-color:#c00000 !important; color:white !important; }
.white-btn.clr-white { background-color:#DCE6F0 !important; border-color:#a9b8c9 !important; color:black !important; }
.white-btn.clr-aqua { background-color:#01EA97 !important; border-color:#019c68 !important; color:black !important; }
.white-btn.clr-purple { background-color:#59017C !important; border-color:#3d0155 !important; color:white !important; }
.white-btn.clr-black { background-color:#010101 !important; border-color:#555555 !important; color:white !important; }
@media(max-width:900px){
  html,body{flex-direction:column;height:auto;min-height:100%;overflow-y:auto}
  #boardWrapper{width:100%;aspect-ratio:1/1;height:auto}
  #boardContainer{width:100%}
  #controlsContainer{width:100%;height:auto}
  #controlsInner{height:auto}
  #moneyContainer{grid-template-columns:repeat(3,1fr);width:100%;gap:6px}
  .moneyBox{width:100%;height:44px}
}</style>

</head>
<body>

<!-- Left: Board -->
<div id="boardWrapper">
<div id="boardContainer">
<div id="board">
<img id="boardImg" src="map2.png" alt="Monopoly Board">
<div id="p1" class="piece red">p1</div>

<div id="centralDisplayContainer">
<div id="topButtons">
<div class="buttonRow">
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!dice0-p1"><button type="submit" class="small-button"><img src="dice.jpg" alt="dice"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!dice4-p1"><button type="submit" class="small-button"><img src="jail.jpg" alt="jail"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!jailpay p1"><button type="submit" class="small-button"><img src="p1.jpg" alt="P1"></button></form>
</div>
<div class="buttonRow">
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!bidadd 5"><button type="submit" class="small-button"><img src="5.jpg" alt="5"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!bidadd 10"><button type="submit" class="small-button"><img src="10.jpg" alt="10"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!bidadd 25"><button type="submit" class="small-button"><img src="25.jpg" alt="25"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!bidadd 50"><button type="submit" class="small-button"><img src="50.jpg" alt="50"></button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!fold"><button type="submit" class="small-button"><img src="fold.jpg" alt="Fold"></button></form>
</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>

<div id="modeToggle">
<div class="modeRow">
<button type="button" class="mode-btn active" data-mode="mortgage">Mortgage</button>
<button type="button" class="mode-btn" data-mode="redeem">Redeem</button>
</div>
<div class="colorRow">
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!addonehouse dblue"><button class="white-btn plus clr-dblue">DB+</button></form>

<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!addonehouse red"><button class="white-btn plus clr-red">RE+</button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!addonehouse white"><button class="white-btn plus clr-white">WH+</button></form>

<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="target" value="rentobot"><input type="hidden" name="msg" value="!addonehouse purple"><button class="white-btn plus clr-purple">PU+</button></form>
