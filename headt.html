<!DOCTYPE html>
<html lang="en">
<head>
<title>Monopoly</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/headt.css">
</head>
<body data-bot="player1bot">
<div id="boardWrapper">
<div id="boardContainer">
<div id="board">
<img id="boardImg" src="map1.png" alt="Monopoly Board">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="boardButtons"></div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">Player1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">Player2: $0</div>
</div>
<iframe name="hiddenFrame" style="display:none;"></iframe>
<div id="topButtons" style="margin-bottom:10px;display:flex;flex-direction:column;gap:6px;align-items:center;">
<div class="button-row" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;">
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!go1"><img src="dice.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!go3"><img src="jail.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!payjail p1"><img src="key.png"></button>
<a id="tradeLink" href="trade-tablet.html?p=1" target="_blank"><button type="button" class="small-button"><img src="p1.png"></button></a>
</div>
<div class="button-row" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;">
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!1"><img src="g1.jpg"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!2"><img src="g2.jpg"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!3"><img src="g3.jpg"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!4"><img src="g4.jpg"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!5"><img src="g5.jpg"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!6"><img src="g6.jpg"></button>
</div>
<div class="button-row" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;">
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 5"><img src="5.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 10"><img src="10.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 25"><img src="25.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 50"><img src="50.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!fold"><img src="fold.png"></button>
</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>
<div id="modeToggle">
<div class="modeRow">
<button type="button" class="mode-btn active" data-mode="mortgage">Mortgage</button>
<button type="button" class="mode-btn" data-mode="redeem">Redeem</button>
<button type="button" class="mode-btn" data-mode="addonehouse">AddHouse</button>
<button type="button" class="mode-btn" data-mode="removeonehouse">RemoveHouse</button>
</div>
</div>
<div id="chatBox">
<div id="chatMessages"></div>
<div id="chatInputRow">
<input id="chatInput" type="text" placeholder="Type a message..." maxlength="250" autocomplete="off">
<button id="chatSend" type="button">Send</button>
</div>
</div>
</div>
</div>
<script>
(function(){
const p=+(new URLSearchParams(location.search).get("p"))||1,bot=`player${p}bot`;
document.body.dataset.bot=bot;
document.querySelectorAll("[data-from]").forEach(e=>e.dataset.from=bot);

const j=document.querySelector('[data-msg^="!payjail"]');j&&(j.dataset.msg=`!payjail p${p}`);
const t=document.getElementById("tradeLink");t&&(t.href=t.href.replace(/p=\d+/,`p=${p}`));
const i=document.querySelector('img[src="p1.png"]');i&&(i.src=`p${p}.png`);

const g1=document.querySelector('[data-msg="!go1"]');g1&&(g1.dataset.msg=`!go${p}`);
const g3=document.querySelector('[data-msg="!go3"]');g3&&(g3.dataset.msg=`!go${p+2}`);
})();
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/javascript.js"></script>
<script src="/pieces2.js"></script>
<script src="/money2.js"></script>
<script src="/display.js"></script>
<script src="/scaleboard.js"></script>
<script src="/buttons.js"></script>
<script src="/chat.js"></script>
<script src="/sound.js"></script>
</body>
</html>
