<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat</title>
<style>
#chatBox{width:350px;height:450px;margin-top:15px;display:flex;flex-direction:column;border-radius:14px;background:linear-gradient(135deg,#fff3e6,#fffaf4);border:1px solid #e5ba8b;box-shadow:0 6px 18px rgba(0,0,0,0.08);overflow:hidden;box-sizing:border-box;font-family:"Poppins","Segoe UI",sans-serif}
#chatMessages{flex:1;overflow-y:auto;padding:12px;color:#000;font-size:14px;line-height:1.5;word-break:break-word;scrollbar-width:thin;scrollbar-color:#e5ba8b transparent;font-weight:700}
#chatMessages::-webkit-scrollbar{width:6px}
#chatMessages::-webkit-scrollbar-thumb{background:#e5ba8b;border-radius:10px}
.chat-message{padding:5px 7px;margin-bottom:5px;border-radius:8px;transition:0.15s;color:#000;font-weight:700}
.chat-message:hover{background:rgba(229,186,139,0.25)}
.chat-message strong{color:#777;font-weight:800}
.chat-message.error{color:#000}
.chat-message.error strong{color:#ff1f4b}
#chatInputRow{display:flex;width:100%;padding:10px;gap:8px;background:#fff0df;border-top:1px solid #e5ba8b;box-sizing:border-box}
#chatInput{flex:1;min-width:0;height:40px;padding:0 12px;background:#fffaf4;color:#000;border:1px solid #e5ba8b;border-radius:10px;outline:none;font-size:14px;transition:0.2s;font-family:"Poppins","Segoe UI",sans-serif;font-weight:600}
#chatInput:focus{border-color:#ff4fa3;box-shadow:0 0 0 3px rgba(255,79,163,0.25)}
#chatInput::placeholder{color:#8a7a70}
#chatSend{height:40px;padding:0 16px;background:linear-gradient(135deg,#ff4fa3,#ff7abf);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:0.2s;font-family:"Poppins","Segoe UI",sans-serif}
#chatSend:hover{background:linear-gradient(135deg,#ff2f91,#ff5fa8)}
#chatSend:active{transform:translateY(1px)}
</style>
</head>
<body>
<div id="chatBox">
<div id="chatMessages"></div>
<div id="chatInputRow">
<input id="chatInput" type="text" placeholder="Type a message..." maxlength="200" autocomplete="off">
<button id="chatSend" type="button">Send</button>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const player=`p${new URLSearchParams(location.search).get('p')||1}`;
const chatMessages=document.getElementById('chatMessages');
const chatInput=document.getElementById('chatInput');
const chatSend=document.getElementById('chatSend');

function addChatMessage({name,message,type}){
const row=document.createElement('div');
row.className=`chat-message ${type}`;
row.innerHTML='<strong></strong><span></span>';
row.firstChild.textContent=name+': ';
row.lastChild.textContent=message;
chatMessages.appendChild(row);
if(chatMessages.children.length>1000)chatMessages.firstChild.remove();
chatMessages.scrollTop=chatMessages.scrollHeight;
}

function send(){
const msg=chatInput.value.trim();
if(!msg)return;
socket.emit('chat-message',{msg});
chatInput.value='';
chatInput.focus();
}

chatInput.addEventListener('keydown',e=>e.key==='Enter'&&(e.preventDefault(),send()));
chatSend.addEventListener('click',send);

socket.on('connect',async()=>{
socket.emit('set-player',player);
const info={width:screen.width,height:screen.height};
if(navigator.userAgentData?.getHighEntropyValues){
try{info.platformVersion=(await navigator.userAgentData.getHighEntropyValues(['platformVersion'])).platformVersion}catch{}
}
socket.emit('screen-info',info);
});

socket.on('chat-message',addChatMessage);
socket.on('cmd-ack',r=>r?.error&&addChatMessage({name:'Monopoly',message:r.error,type:'error'}));
</script>
</body>
</html>
