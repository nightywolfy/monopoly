<!DOCTYPE html>
<html lang="en">
<head>
<title>Monopoly Player Selection</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="/index.css">
</head>
<body>
<div id="boardWrapper">
<div id="board">
<img id="boardImg" src="map3.png">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="p3" class="piece orange">p3</div>
<div id="p4" class="piece green">p4</div>
<div id="p5" class="piece purple">p5</div>
<div id="p6" class="piece white">p6</div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">P1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">P2: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">P3: $0</div>
<div id="money-p4-overlay" class="moneyBox green">P4: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">P5: $0</div>
<div id="money-p6-overlay" class="moneyBox white">P6: $0</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>
</div>
<div id="playerContainer">
<div style="position:relative;width:100%;margin-bottom:20px;display:flex;justify-content:center;align-items:flex-start;">
<div style="position:absolute;left:0;top:240px;display:flex;flex-direction:column;gap:10px;">
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/property3.png" target="_blank">
<img src="https://raw.githubusercontent.com/nightywolfy/monopoly/main/property3.png" style="width:80px;height:auto;border-radius:10px;box-shadow:0 0 12px #00d4ff;">
</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/rules.txt" target="_blank" style="width:80px;padding:10px;background:#6a0dad;color:white;text-align:center;border-radius:10px;text-decoration:none;box-shadow:0 0 12px #6a0dad;">
Rules
</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/updates.txt" target="_blank" style="width:80px;padding:10px;background:#28a745;color:white;text-align:center;border-radius:10px;text-decoration:none;box-shadow:0 0 12px #28a745;">
Updates
</a>
</div>
</div>
<!-- Player selection buttons -->
<div class="playerSection">
<h2>2-Player Game</h2>
<div class="playerGrid">
<a href="head.html?p=1" class="playerBtn">Player 1</a>
<a href="head.html?p=2" class="playerBtn">Player 2</a>
</div>
</div>
<div class="desktopOnly">
<div class="playerSection sixPlayerSection">
<h2>6 Player Game</h2>
<div class="playerGrid">
<a href="p1detect.html" class="playerBtn">Player 1</a>
<a href="p2detect.html" class="playerBtn">Player 2</a>
<a href="p3detect.html" class="playerBtn">Player 3</a>
<a href="p4detect.html" class="playerBtn">Player 4</a>
<a href="p5detect.html" class="playerBtn">Player 5</a>
<a href="p6detect.html" class="playerBtn">Player 6</a>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/index.js"></script>
</body>
</html>
