<!DOCTYPE html>
<html lang="en">
<head>
<title>Monopoly Player Selection</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>
<body>
<div id="boardWrapper">
<div id="board">
<img id="boardImg" src="map2.png">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="p3" class="piece orange">p3</div>
<div id="p4" class="piece green">p4</div>
<div id="p5" class="piece purple">p5</div>
<div id="p6" class="piece white">p6</div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">P1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">P2: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">P3: $0</div>
<div id="money-p4-overlay" class="moneyBox green">P4: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">P5: $0</div>
<div id="money-p6-overlay" class="moneyBox white">P6: $0</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>
</div>
<div id="playerContainer">
<div class="brandHeader">
<div class="brandLogo">

<svg class="brandIcon" viewBox="0 0 120 60" aria-hidden="true">
<path d="M6 44 C 16 44, 22 40, 26 34 C 20 32, 17 27, 18 22 C 22 25, 27 27, 32 26 C 30 20, 33 14, 39 11 C 38 16, 40 20, 44 22 C 52 16, 62 12, 72 12 C 78 12, 83 15, 85 20 C 90 18, 96 19, 100 23 L 94 25 C 98 27, 102 31, 104 36 L 96 34 C 93 40, 85 44, 76 44 C 68 44, 61 41, 57 36 C 48 40, 36 42, 26 40 C 19 42, 12 43, 6 44 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M39 11 L 42 5 M85 20 L 91 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>

<span class="brandWordmark">Monopoly</span>
</div>
<div class="brandDivider"></div>
<div class="quickLinks">
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/property3.png" target="_blank" class="iconPill" aria-label="Board preview">

<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>

</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/rules.txt" target="_blank" class="linkPill linkPill--light">Rules</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/updates.txt" target="_blank" class="linkPill linkPill--solid">Updates</a>
</div>
</div>

<!-- Player selection buttons -->
<div class="playerSection">
<h2>2-Player Game</h2>
<div class="sectionDivider"><span></span><i></i><span></span></div>
<div class="playerGrid">
<a href="p1head.html" class="playerBtn playerBtn--1">Player 1</a>
<a href="p2head.html" class="playerBtn playerBtn--2">Player 2</a>
</div>
</div>
<div class="desktopOnly">
<div class="playerSection sixPlayerSection">
<h2>6 Player Game</h2>
<div class="sectionDivider"><span></span><i></i><span></span></div>
<div class="playerGrid">
<a href="p1detect.html" class="playerBtn playerBtn--1">Player 1</a>
<a href="p2detect.html" class="playerBtn playerBtn--2">Player 2</a>
<a href="p3detect.html" class="playerBtn playerBtn--3">Player 3</a>
<a href="p4detect.html" class="playerBtn playerBtn--4">Player 4</a>
<a href="p5detect.html" class="playerBtn playerBtn--5">Player 5</a>
<a href="p6detect.html" class="playerBtn playerBtn--6">Player 6</a>
</div>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/javascript.js"></script>
<script src="/pieces.js"></script>
<script src="/money.js"></script>
<script src="/display.js"></script>
<script src="/scaleboard2.js"></script>
<script src="/sound.js"></script>
</body>
</html>
