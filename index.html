<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monopoly Player Selection</title>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;background:black;font-family:sans-serif;display:flex;overflow:hidden;color:white}
#boardWrapper{width:50%;height:100%;display:flex;justify-content:center;align-items:center;position:relative;background:black}
#board{position:relative;height:900px;width:900px;display:flex;flex-direction:column;align-items:center}
#boardImg{width:900px;height:900px}
.piece{width:32px;height:32px;border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid transparent;box-shadow:0 0 6px rgba(0,0,0,.4);transition:left .4s ease,top .4s ease;color:white}
.red{background:#ff4d4d;border-color:#ff8080}
.blue{background:#3399ff;border-color:#66a3ff}
.orange{background:goldenrod;border-color:#ffde59;color:black}
.green{background:limegreen;border-color:#aaffaa;color:black}
.purple{background:#9933ff;border-color:#cc99ff}
.white{background:#fff;border-color:#ccc;color:black}
.dot{width:12px;height:12px;border-radius:50%;position:absolute;z-index:30;border:2px solid black;box-shadow:0 0 1px 1px white}
#centralDisplayContainer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:25px;z-index:10}

#moneyContainer{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:320px}

.moneyBox{padding:3px 8px;border-radius:10px;width:100%;height:45px;box-sizing:border-box;text-align:center;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;word-wrap:break-word;box-shadow:0 0 10px rgba(0,212,255,.8),0 0 15px rgba(106,13,173,.6);border:2px solid rgba(255,255,255,.5);color:black}

.moneyBox.red{background:linear-gradient(135deg,#ff4b4b,#ff9999);color:black}
.moneyBox.blue{background:linear-gradient(135deg,#3399ff,#99ddff);color:black}
.moneyBox.orange{background:linear-gradient(135deg,#ff8c00,#ffd27f);color:black}
.moneyBox.green{background:linear-gradient(135deg,#32cd32,#b6ffb6);color:black}
.moneyBox.purple{background:linear-gradient(135deg,#8a2be2,#d9a7ff);color:black}
.moneyBox.white{background:linear-gradient(135deg,#ffffff,#cccccc);color:black}

#displayContainer{display:flex;flex-direction:column;gap:15px;align-items:center}
.displayBox{padding:8px 14px;border-radius:12px;width:300px;text-align:center;font-weight:bold;font-size:22px;background:linear-gradient(135deg,#6a0dad,#00d4ff);color:white;box-shadow:0 0 12px #6a0dad,0 0 18px #00d4ff;word-wrap:break-word}
.hotel,.house{width:29px;height:29px;position:absolute}
#playerContainer{width:50%;height:100%;background:#111;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:15px;box-shadow:inset 0 0 40px rgba(0,212,255,.3);padding:10px;box-sizing:border-box;overflow-y:auto}
.playerSection{width:100%;max-width:260px;background:rgba(255,255,255,.03);border:1px solid rgba(0,212,255,.25);border-radius:14px;padding:10px;text-align:center;box-shadow:0 0 25px rgba(0,0,0,.4)}
.playerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.playerSection h2{color:#FFD700;margin:0 0 10px;font-size:16px;text-shadow:0 0 8px black}
.playerBtn{display:flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#6a0dad,#00d4ff);color:white;padding:10px 6px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s;min-height:35px}
.playerBtn:hover{transform:scale(1.05);box-shadow:0 0 20px #00d4ff,0 0 30px #6a0dad}
.playerBtn:active{transform:scale(.97)}
#quickButtons{background:linear-gradient(135deg,#111,#333);padding:15px;border-radius:15px;box-shadow:0 0 20px #000;text-align:center}
#quickButtons .map1{background:linear-gradient(135deg,#0044aa,#00c3ff);color:white!important}
#quickButtons .map2{background:linear-gradient(135deg,#5a0099,#d400ff);color:white!important}
#quickButtons .map3{background:linear-gradient(135deg,#00733e,#00e676);color:white!important}
#quickButtons .map4{background:linear-gradient(135deg,#b34700,#ff9100);color:white!important}
#quickButtons button:hover{transform:scale(1.08);filter:brightness(1.25)}
.sixPlayerSection{width:100%;max-width:320px;padding:10px}
.sixPlayerSection .playerGrid{grid-template-columns:repeat(2,1fr);gap:10px}
.sixPlayerSection .playerBtn{font-size:16px;padding:12px;min-height:45px}
.mobilePlayers{display:none;width:100%;max-width:320px}
.mobilePlayers .playerGrid{grid-template-columns:repeat(2,1fr);gap:10px}
.mobilePlayers .playerBtn{font-size:16px;padding:12px;min-height:45px}
.mobileOnly,.desktopOnly{display:block}

</style>
</head>
<body>

<!-- Left: Board -->
<div id="boardWrapper">
<div id="board">
<img id="boardImg" src="map2.png">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="p3" class="piece orange">p3</div>
<div id="p4" class="piece green">p4</div>
<div id="p5" class="piece purple">p5</div>
<div id="p6" class="piece white">p6</div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">P1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">P2: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">P3: $0</div>
<div id="money-p4-overlay" class="moneyBox green">P4: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">P5: $0</div>
<div id="money-p6-overlay" class="moneyBox white">P6: $0</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>
</div>

<!-- Right: Player Selection -->
<div id="playerContainer">
<div style="position:relative;width:100%;margin-bottom:20px;display:flex;justify-content:center;align-items:flex-start;">
<div style="position:absolute;left:30px;top:240px;display:flex;flex-direction:column;gap:10px;">
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/property3.png" target="_blank">
<img src="https://raw.githubusercontent.com/nightywolfy/monopoly/main/property3.png" style="width:80px;height:auto;border-radius:10px;box-shadow:0 0 12px #00d4ff;">
</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/rules.txt" target="_blank" style="width:80px;padding:10px;background:#6a0dad;color:white;text-align:center;border-radius:10px;text-decoration:none;box-shadow:0 0 12px #6a0dad;">
Rules
</a>
<a href="https://raw.githubusercontent.com/nightywolfy/monopoly/main/updates.txt" target="_blank" style="width:80px;padding:10px;background:#28a745;color:white;text-align:center;border-radius:10px;text-decoration:none;box-shadow:0 0 12px #28a745;">
Updates
</a>
</div>
</div>

<!-- Player selection buttons -->
<div class="playerSection">
<h2>2-Player Game</h2>
<div class="playerGrid">
<a href="player1.html" class="playerBtn">Player 1</a>
<a href="player2.html" class="playerBtn">Player 2</a>
</div>
</div>

<div class="desktopOnly">
<div class="playerSection sixPlayerSection">
<h2>6 Player Game</h2>
<div class="playerGrid">
<a href="p1.html" class="playerBtn">Player 1</a>
<a href="p2.html" class="playerBtn">Player 2</a>
<a href="p3.html" class="playerBtn">Player 3</a>
<a href="p4.html" class="playerBtn">Player 4</a>
<a href="p5.html" class="playerBtn">Player 5</a>
<a href="p6.html" class="playerBtn">Player 6</a>
</div>
</div>
</div>

<div class="mobileOnly mobilePlayers">
<div class="playerSection">
<h2>Mobile 6 Player</h2>
<div class="playerGrid">
<a href="p1m.html" class="playerBtn">Player 1</a>
<a href="p2m.html" class="playerBtn">Player 2</a>
<a href="p3m.html" class="playerBtn">Player 3</a>
<a href="p4m.html" class="playerBtn">Player 4</a>
<a href="p5m.html" class="playerBtn">Player 5</a>
<a href="p6m.html" class="playerBtn">Player 6</a>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit('identify', {page: 'computer'});
let currentMap = 2;
let activeDots = {};
let labels = {p1:'Player1',p2:'Player2',p3:'Player3',p4:'Player4',p5:'Player5',p6:'Player6'};
let lastMoney = {p1:0,p2:0,p3:0,p4:0,p5:0,p6:0};
const colorMap = {red:"p1", blue:"p2", orange:"p3", green:"p4", purple:"p5", white:"p6"};
const buildingPositions={
1:{x:740,y:795},
3:{x:595,y:795},
6:{x:373,y:795},
8:{x:232,y:795},
9:{x:160,y:795},
11:{x:105,y:735},
12:{x:105,y:665},
14:{x:105,y:515},
16:{x:105,y:375},
17:{x:105,y:300},
19:{x:105,y:155},
21:{x:156,y:105},
22:{x:230,y:105},
24:{x:375,y:105},
26:{x:520,y:105},
28:{x:665,y:105},
29:{x:740,y:105},
31:{x:793,y:155},
33:{x:793,y:300},
34:{x:793,y:370},
37:{x:793,y:590},
39:{x:793,y:730},
41:{x:595,y:680},
42:{x:525,y:680},
63:{x:678,y:590},
44:{x:305,y:680},
45:{x:218,y:590},
47:{x:380,y:680},
50:{x:218,y:305},
51:{x:218,y:375},
53:{x:304,y:220},
56:{x:595,y:220},
57:{x:678,y:305},
59:{x:523,y:220}
};

function renderDotsFromServer(data){
const board=document.getElementById('board');
if(!data)return;
for(const [num,info] of Object.entries(data)){
if(!info)continue;
if(activeDots[num]){
const el=activeDots[num];
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
}else{
const el=document.createElement('div');
el.className='dot';
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
el.style.zIndex=30;
board.appendChild(el);
activeDots[num]=el;
}
}
}

function updatePieces(data){
if(!data||typeof data!=="object"){console.warn("Pieces data invalid:",data);return;}
const posMap={};
for(const [color,pos] of Object.entries(data)){
if(!pos||typeof pos.x!=="number"||typeof pos.y!=="number"){console.warn("Invalid position for",color,pos);continue;}
const key=`${pos.x},${pos.y}`;
if(!posMap[key])posMap[key]=[];
posMap[key].push(color);
}
for(const [key,colors] of Object.entries(posMap)){
const [baseX,baseY]=key.split(',').map(Number);
colors.forEach((color,idx)=>{
const id=colorMap[color];
if(!id)return;
const el=document.getElementById(id);
if(!el)return;
let offsetX=0,offsetY=0;
if(idx===1){offsetX=10;}
if(idx===2){offsetY=10;}
if(idx===3){offsetX=10;offsetY=10;}
if(idx===4){offsetX=20;}
if(idx===5){offsetX=20;offsetY=10;}
el.style.left=(baseX+offsetX)+'px';
el.style.top=(baseY+offsetY)+'px';
el.style.zIndex=20;
});
}
}

// Displays
function updateDisplay1(text){ document.getElementById('display1').innerText = text || ''; }
function updateDisplay2(text){ document.getElementById('display2').innerText = text || ''; }

// Money
function renderMoneyBoxes(){
document.getElementById('money-p1-overlay').textContent = labels.p1 + ': $' + lastMoney.p1;
document.getElementById('money-p2-overlay').textContent = labels.p2 + ': $' + lastMoney.p2;
document.getElementById('money-p3-overlay').textContent = labels.p3 + ': $' + lastMoney.p3;
document.getElementById('money-p4-overlay').textContent = labels.p4 + ': $' + lastMoney.p4;
document.getElementById('money-p5-overlay').textContent = labels.p5 + ': $' + lastMoney.p5;
document.getElementById('money-p6-overlay').textContent = labels.p6 + ': $' + lastMoney.p6;
}

function updateMoney(data){
lastMoney = {...lastMoney, ...data};
renderMoneyBoxes();
}

function updateLabels(data){
labels = {...labels, ...data};
renderMoneyBoxes();
}

function renderBuildings(data){
const board=document.getElementById('board');
document.querySelectorAll('.house,.hotel').forEach(el=>el.remove());
if(!data)return;
for(const [space,type] of Object.entries(data)){
const pos=buildingPositions[space];
if(!pos)continue;
const isHouse=type.startsWith('house');
const el=document.createElement('img');
el.src=isHouse?`${type}.jpg`:'hotel.jpg';
el.className=isHouse?'house':'hotel';
el.style.position='absolute';
el.style.left=(pos.x-14)+'px';
el.style.top=(pos.y-14)+'px';
el.style.width='29px';
el.style.height='29px';
el.style.zIndex=isHouse?25:26;
board.appendChild(el);
}
}

function scaleBoard(){
const container=document.getElementById('board');
const wrapper=document.getElementById('boardWrapper');
const scaleX=wrapper.clientWidth/930;
const scaleY=wrapper.clientHeight/930;
const scale=Math.min(scaleX,scaleY);
container.style.transform=`scale(${scale})`;
}

window.addEventListener('resize',scaleBoard);
scaleBoard();
if(!window.__SOUND_LISTENER_LOCK__){
window.__SOUND_LISTENER_LOCK__=true;
socket.on('play-sound',({file})=>{
new Audio(file).play();
});
console.log("Sound listener attached (single instance)");
}

document.addEventListener("DOMContentLoaded",()=>{
document.querySelectorAll('form[target="hiddenFrame"]').forEach(form=>{
form.addEventListener("submit",function(e){
e.preventDefault();
const bot=form.querySelector('[name="bot"]').value;
const msg=form.querySelector('[name="msg"]').value;
const targetInput=form.querySelector('[name="target"]');
const target=targetInput?.value||undefined;
fetch(form.action,{method:form.method||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bot,target,msg})}).catch(err=>console.error(err));
});
});
});

socket.on('piecesUpdate', updatePieces);
socket.on('draw-dot', info => { renderDotsFromServer({[info.num]: info}); });
socket.on('map-change', n => document.getElementById('boardImg').src = `map${n}.png`);
socket.on('reload-dots', data => { renderDotsFromServer(data); });
socket.on('displayUpdate1', data=>updateDisplay1(data.text));
socket.on('displayUpdate2', data=>updateDisplay2(data.text));
socket.on('moneyUpdate', updateMoney);
socket.on('labelsUpdate', updateLabels);
socket.on('buildingsUpdate', renderBuildings);
socket.on('remove-dot',n=>{if(activeDots[n]){activeDots[n].remove();delete activeDots[n];}});
socket.on('clear-all-dots',()=>{Object.values(activeDots).forEach(e=>e.remove());activeDots={};});
// Initial fetch
fetch('/pieces.json').then(res=>res.json()).then(updatePieces);
fetch('/display1.json').then(res=>res.json()).then(data=>updateDisplay1(data.text));
fetch('/display2.json').then(res=>res.json()).then(data=>updateDisplay2(data.text));
fetch('/money.json').then(res=>res.json()).then(updateMoney);
fetch('/labels.json').then(res=>res.json()).then(updateLabels).catch(()=>{});
fetch('/building.json').then(r=>r.json()).then(renderBuildings);
</script>

</body>
</html>
