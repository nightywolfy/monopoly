<!DOCTYPE html>
<html lang="en">
<head>
<title>Trade Menu</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#111;font-family:sans-serif;color:white;overflow-x:hidden;overflow-y:auto;display:block}
#boardWrapper{display:none}
#playerContainer{width:100%;height:auto;min-height:100vh;background:#111;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:10px;box-shadow:none;padding:10px;box-sizing:border-box;overflow:visible}
#builder{width:100%;max-width:500px;background:rgba(255,255,255,.03);border:1px solid rgba(0,212,255,.25);border-radius:12px;padding:10px;box-shadow:0 0 18px rgba(0,0,0,.4);box-sizing:border-box}
#builder h2{margin:0 0 10px;text-align:center;color:#FFD700;text-shadow:0 0 8px black;font-size:18px}
.section{margin-bottom:10px}
.section-label{font-size:11px;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.btn-row{display:grid;gap:6px}
.cmd-row{grid-template-columns:repeat(2,1fr)}
.player-row{grid-template-columns:repeat(3,1fr)}
.amount-row{grid-template-columns:repeat(3,1fr)}
button.opt{padding:10px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-weight:bold;font-size:14px;cursor:pointer;transition:.15s}
button.opt:hover{filter:brightness(1.2)}
button.opt.selected{background:linear-gradient(135deg,#6a0dad,#00d4ff);border-color:#00d4ff;box-shadow:0 0 10px #6a0dad}
.player-row button.p1.selected{background:linear-gradient(135deg,#ff4d4d,#ff8080);color:black}
.player-row button.p2.selected{background:linear-gradient(135deg,#3399ff,#66a3ff)}
.player-row button.p3.selected{background:linear-gradient(135deg,goldenrod,#ffde59);color:black}
.player-row button.p4.selected{background:linear-gradient(135deg,limegreen,#aaffaa);color:black}
.player-row button.p5.selected{background:linear-gradient(135deg,#9933ff,#cc99ff)}
.player-row button.p6.selected{background:#fff;color:black}
#customAmount{width:100%;box-sizing:border-box;padding:10px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-size:14px;margin-top:6px}
#customAmount::placeholder{color:#777}
#preview{background:#000;border:1px solid #6a0dad;border-radius:7px;padding:10px 8px;font-family:monospace;font-size:12px;color:#00ffae;min-height:15px;margin-bottom:8px;word-break:break-all}
#enterBtn{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#00c853,#69f0ae);color:black;font-weight:bold;font-size:16px;cursor:pointer;transition:.15s}
#enterBtn:hover{filter:brightness(1.1)}
#enterBtn:disabled{opacity:.4;cursor:not-allowed;filter:none}
#cmdLog{margin-top:10px;max-height:150px;overflow-y:auto;font-family:monospace;font-size:11px;color:#888;border-top:1px solid rgba(255,255,255,.1);padding-top:6px}
#cmdLog div{padding:3px 0}
#pickSpaceBtn{width:100%;margin-top:6px;background:#1a1a1a}
#pickSpaceBtn.selected{background:linear-gradient(135deg,#00c853,#69f0ae)!important;color:black;box-shadow:0 0 10px #00c853}
.spacePicked{outline:3px solid #00ffae!important;outline-offset:-3px;z-index:101!important}
.spacePicked.entryColor1{outline-color:#ff4d4d!important}
.spacePicked.entryColor2{outline-color:#3399ff!important}
.spacePicked.entryColor3{outline-color:goldenrod!important}
.spacePicked.entryColor4{outline-color:limegreen!important}
.spacePicked.entryColor5{outline-color:#9933ff!important}
.spacePicked.entryColor6{outline-color:#ffffff!important}
.entryCard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px;margin-bottom:8px}
.entryCard .entryTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.entryCard .entryTop span{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.removeEntryBtn{background:#3a1010;color:#ff8080;border:1px solid #661a1a;border-radius:5px;padding:5px 8px;font-size:11px;cursor:pointer}
.removeEntryBtn:hover{background:#551515;color:#fff}
.entryCard input.amountInput{width:100%;box-sizing:border-box;padding:10px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-size:14px;margin-top:5px}
.entryCard .spacesLabel{font-size:11px;color:#00ffae;margin-top:6px;min-height:14px;word-break:break-all}
#builder .actionButtons{display:flex;gap:6px;margin-bottom:8px}
#builder .actionButtons form{flex:1;margin:0}
#builder .actionButtons button{width:100%;padding:10px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.15);font-size:14px;font-weight:bold;cursor:pointer}
.small-button{padding:10px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-size:14px;font-weight:bold;cursor:pointer}
#resetBtn{width:100%;margin-bottom:8px}
.mobileOnly{display:block}
.desktopOnly{display:none}
/* Command Builder */
#builder{width:100%;max-width:280px;background:rgba(255,255,255,.03);border:1px solid rgba(0,212,255,.25);border-radius:12px;padding:10px;box-shadow:0 0 18px rgba(0,0,0,.4);box-sizing:border-box}
#builder h2{margin:0 0 10px;text-align:center;color:#FFD700;text-shadow:0 0 8px black;font-size:14px}
.section{margin-bottom:10px}
.section-label{font-size:11px;color:#aaa;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.btn-row{display:grid;gap:6px}
.cmd-row{grid-template-columns:repeat(2,1fr)}
.player-row{grid-template-columns:repeat(3,1fr)}
.amount-row{grid-template-columns:repeat(3,1fr)}
button.opt{padding:7px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-weight:bold;font-size:12px;cursor:pointer;transition:.15s}
button.opt:hover{filter:brightness(1.2)}
button.opt.selected{background:linear-gradient(135deg,#6a0dad,#00d4ff);border-color:#00d4ff;box-shadow:0 0 10px #6a0dad}
.player-row button.p1.selected{background:linear-gradient(135deg,#ff4d4d,#ff8080);color:black}
.player-row button.p2.selected{background:linear-gradient(135deg,#3399ff,#66a3ff)}
.player-row button.p3.selected{background:linear-gradient(135deg,goldenrod,#ffde59);color:black}
.player-row button.p4.selected{background:linear-gradient(135deg,limegreen,#aaffaa);color:black}
.player-row button.p5.selected{background:linear-gradient(135deg,#9933ff,#cc99ff)}
.player-row button.p6.selected{background:#fff;color:black}
#customAmount{width:100%;box-sizing:border-box;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-size:12px;margin-top:6px}
#customAmount::placeholder{color:#777}

#enterBtn{width:100%;padding:9px;border:none;border-radius:8px;background:linear-gradient(135deg,#00c853,#69f0ae);color:black;font-weight:bold;font-size:14px;cursor:pointer;transition:.15s}
#enterBtn:hover{filter:brightness(1.1)}
#enterBtn:disabled{opacity:.4;cursor:not-allowed;filter:none}
#cmdLog{margin-top:10px;max-height:80px;overflow-y:auto;font-family:monospace;font-size:10px;color:#888;border-top:1px solid rgba(255,255,255,.1);padding-top:6px}
#cmdLog div{padding:2px 0}
#pickSpaceBtn{width:100%;margin-top:6px;background:#1a1a1a}
#pickSpaceBtn.selected{background:linear-gradient(135deg,#00c853,#69f0ae)!important;color:black;box-shadow:0 0 10px #00c853}
.spacePicked{outline:3px solid #00ffae!important;outline-offset:-3px;z-index:101!important}
.spacePicked.entryColor1{outline-color:#ff4d4d!important}
.spacePicked.entryColor2{outline-color:#3399ff!important}
.spacePicked.entryColor3{outline-color:goldenrod!important}
.spacePicked.entryColor4{outline-color:limegreen!important}
.spacePicked.entryColor5{outline-color:#9933ff!important}
.spacePicked.entryColor6{outline-color:#ffffff!important}
.entryCard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px;margin-bottom:7px}
.entryCard .entryTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.entryCard .entryTop span{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.removeEntryBtn{background:#3a1010;color:#ff8080;border:1px solid #661a1a;border-radius:5px;padding:2px 6px;font-size:10px;cursor:pointer}
.removeEntryBtn:hover{background:#551515;color:#fff}
.entryCard input.amountInput{width:100%;box-sizing:border-box;padding:6px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:#1a1a1a;color:white;font-size:12px;margin-top:5px}
.entryCard .spacesLabel{font-size:10px;color:#00ffae;margin-top:5px;min-height:12px;word-break:break-all}
/* Accept / Reject buttons */
#builder .actionButtons{display:flex;gap:6px;margin-bottom:8px}
#builder .actionButtons form{flex:1;margin:0}
#builder .actionButtons button{width:100%;padding:7px 4px;border-radius:7px;border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:bold;cursor:pointer}

@media(max-width:900px){
#boardWrapper{display:none}
#playerContainer{width:100%;height:auto;min-height:100vh}
#builder{width:100%;max-width:500px}
}
</style>
</head>


<!-- Left: Board -->
<body>
<div id="boardWrapper">
<div id="board">
<img id="boardImg" src="map3.png">
<div id="boardButtons"></div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">P1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">P2: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">P3: $0</div>
<div id="money-p4-overlay" class="moneyBox green">P4: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">P5: $0</div>
<div id="money-p6-overlay" class="moneyBox white">P6: $0</div>
</div>
</div>
</div>
</div>
<!-- Right: Player Selection -->
<div id="playerContainer">
<div style="position:relative;width:100%;margin-bottom:20px;display:flex;justify-content:center;align-items:flex-start;">
<div style="position:absolute;left:30px;top:240px;display:flex;flex-direction:column;gap:10px;">

</div>
</div>

<!-- Command Builder -->
<div id="builder">
<h2>Trade Menu</h2>
<button id="resetBtn" class="small-button" style="width:100%;margin-bottom:8px">RESET</button>
<div style="display:flex;gap:8px;margin-bottom:8px;">
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!accept"><button type="submit" class="small-button">ACCEPT</button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!reject"><button type="submit" class="small-button">REJECT</button></form>
</div>
<div class="section">
<div class="section-label">Entries</div>
<div id="entriesContainer"></div>
</div>
<div id="preview">(select players and enter amounts)</div>
<button id="enterBtn" disabled>Enter</button>
<div id="cmdLog"></div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit('identify', {page: 'computer'});
let currentMap = 2;
let activeDots = {};
const boardSpaceBtns = {};
let labels = {p1:'Player1',p2:'Player2',p3:'Player3',p4:'Player4',p5:'Player5',p6:'Player6'};
let lastMoney = {p1:0,p2:0,p3:0,p4:0,p5:0,p6:0};
let buildingPositions = {};
let lastBuildingsData = null;

function renderBuildings(data){
const board=document.getElementById('board');
document.querySelectorAll('.house,.hotel').forEach(el=>el.remove());
if(!data)return;
for(const [space,type] of Object.entries(data)){
const pos=buildingPositions[space];
if(!pos)continue;
const isHouse=type.startsWith('house');
const el=document.createElement('img');
el.src=isHouse?`${type}.jpg`:'hotel.jpg';
el.className=isHouse?'house':'hotel';
el.style.position='absolute';
el.style.left=(pos.x-14)+'px';
el.style.top=(pos.y-14)+'px';
el.style.width='29px';
el.style.height='29px';
el.style.zIndex=isHouse?25:26;
board.appendChild(el);
}
}


function renderDotsFromServer(data){
const board=document.getElementById('board');
if(!data)return;
for(const [num,info] of Object.entries(data)){
if(!info)continue;
if(activeDots[num]){
const el=activeDots[num];
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
}else{
const el=document.createElement('div');
el.className='dot';
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
el.style.zIndex=30;
board.appendChild(el);
activeDots[num]=el;
}
}
}

const group1 = [1,3,4,5,6,8,9,21,22,24,25,26,27,28,29,41,42,44,45,53,56,57];
const group2 = [11,12,13,14,15,16,17,19,31,33,34,35,37,38,39,47,50,51,59,63];
const boardButtonsContainer = document.getElementById('boardButtons');


function buildBoardButtons(data){
data.forEach(coords=>{
const spaceNum=coords.number;
const btn=document.createElement('button');
btn.textContent=spaceNum;
btn.style.position='absolute';
btn.style.left=`${coords.x}px`;
btn.style.top=`${coords.y}px`;
if(group1.includes(spaceNum)){btn.style.width='50px';btn.style.height='105px';btn.style.fontSize='0.85em';}
else if(group2.includes(spaceNum)){btn.style.width='105px';btn.style.height='50px';btn.style.fontSize='0.75em';}
else{btn.style.width='110px';btn.style.height='110px';btn.style.fontSize='0.8em';}
btn.style.backgroundColor='transparent';
btn.style.border='none';
btn.style.color='transparent';
btn.style.zIndex=100;
btn.style.cursor='pointer';
btn.style.pointerEvents='auto';
boardButtonsContainer.appendChild(btn);
});
}


function renderMoneyBoxes(){
document.getElementById('money-p1-overlay').textContent = labels.p1 + ': $' + lastMoney.p1;
document.getElementById('money-p2-overlay').textContent = labels.p2 + ': $' + lastMoney.p2;
document.getElementById('money-p3-overlay').textContent = labels.p3 + ': $' + lastMoney.p3;
document.getElementById('money-p4-overlay').textContent = labels.p4 + ': $' + lastMoney.p4;
document.getElementById('money-p5-overlay').textContent = labels.p5 + ': $' + lastMoney.p5;
document.getElementById('money-p6-overlay').textContent = labels.p6 + ': $' + lastMoney.p6;
}

function updateMoney(data){
lastMoney = {...lastMoney, ...data};
renderMoneyBoxes();
}

function updateLabels(data){
labels = {...labels, ...data};
renderMoneyBoxes();
}


function scaleBoard(){
const container=document.getElementById('boardContainer');
const wrapper=document.getElementById('boardWrapper');
const scaleX=wrapper.clientWidth/930;
const scaleY=wrapper.clientHeight/930;
const scale=Math.min(scaleX,scaleY);
container.style.transform=`scale(${scale})`;
}



document.addEventListener("DOMContentLoaded",()=>{
document.querySelectorAll('form[target="hiddenFrame"]').forEach(form=>{
form.addEventListener("submit",function(e){
e.preventDefault();
const bot=form.querySelector('[name="bot"]').value;
const msg=form.querySelector('[name="msg"]').value;
const targetInput=form.querySelector('[name="target"]');
const target=targetInput?.value||undefined;
fetch(form.action,{method:form.method||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bot,target,msg})}).catch(err=>console.error(err));
});
});
});


socket.on('draw-dot', info => { renderDotsFromServer({[info.num]: info}); });
socket.on('map-change', n => document.getElementById('boardImg').src = `map${n}.png`);
socket.on('reload-dots', data => { renderDotsFromServer(data); });
socket.on('moneyUpdate', updateMoney);
socket.on('labelsUpdate', updateLabels);
socket.on('buildingsUpdate', data=>{ lastBuildingsData=data; renderBuildings(data); });
socket.on('buildingPositions', data=>{ buildingPositions=data; renderBuildings(lastBuildingsData); });
socket.on('boardClickPositions', data=>{ buildBoardButtons(data); });
socket.on('remove-dot',n=>{if(activeDots[n]){activeDots[n].remove();delete activeDots[n];}});
socket.on('clear-all-dots',()=>{Object.values(activeDots).forEach(e=>e.remove());activeDots={};});
socket.on('clickableSpacesData', data => { buildBoardButtons(data); });
fetch('/money.json').then(res=>res.json()).then(updateMoney);
fetch('/labels.json').then(res=>res.json()).then(updateLabels).catch(()=>{});
fetch('/building.json').then(r=>r.json()).then(data=>{ lastBuildingsData=data; renderBuildings(data); });



// ---- Command Builder ----
let cbCmd='!offer';
let entries=[];
let nextEntryId=1;
const cmdRow=document.getElementById('cmdRow');
const entriesContainer=document.getElementById('entriesContainer');
const addEntryBtn=document.getElementById('addEntryBtn');
const cbPreview=document.getElementById('preview');
const enterBtn=document.getElementById('enterBtn');
const cmdLog=document.getElementById('cmdLog');

function makeEntry(player){
const id=nextEntryId++;
const entry={id,players:[player],amount:'0',spaces:[],picking:false};
entries.push(entry);
renderEntries();
cbUpdatePreview();
}

function removeEntry(id){
const index=entries.findIndex(en=>en.id===id);
if(index<2)return;
const entry=entries[index];
entry.spaces.forEach(sp=>{
const b=boardSpaceBtns[sp];
if(b)b.classList.remove('spacePicked',`entryColor${(entry.id%6)||6}`);
});
entries.splice(index,1);
renderEntries();
cbUpdatePreview();
}

function renderEntries(){
entriesContainer.innerHTML='';
entries.forEach((entry,idx)=>{
const card=document.createElement('div');
card.className='entryCard';

const top=document.createElement('div');
top.className='entryTop';

const label=document.createElement('span');
label.textContent=`Entry ${idx+1}`;
top.appendChild(label);

if(idx>=2){
const removeBtn=document.createElement('button');
removeBtn.className='removeEntryBtn';
removeBtn.textContent='✕ Remove';
removeBtn.addEventListener('click',()=>removeEntry(entry.id));
top.appendChild(removeBtn);
}

card.appendChild(top);

const playerLabel=document.createElement('div');
playerLabel.className='section-label';
playerLabel.textContent='Player';
card.appendChild(playerLabel);

const playerRow=document.createElement('div');
playerRow.className='btn-row player-row';

['p1','p2','p3','p4','p5','p6'].forEach(p=>{
const b=document.createElement('button');
b.type='button';
b.className=`opt ${p}`;
b.textContent=p.toUpperCase();

if(entry.players.includes(p))b.classList.add('selected');

b.addEventListener('click',()=>{
entry.players=[p];
renderEntries();
cbUpdatePreview();
});

playerRow.appendChild(b);
});

card.appendChild(playerRow);

const amountLabel=document.createElement('div');
amountLabel.className='section-label';
amountLabel.style.marginTop='4px';
amountLabel.textContent='Amount';
card.appendChild(amountLabel);

const amountInput=document.createElement('input');
amountInput.type='number';
amountInput.className='amountInput';
amountInput.placeholder='Enter amount...';
amountInput.value=entry.amount;

amountInput.addEventListener('input',()=>{
entry.amount=amountInput.value;
cbUpdatePreview();
});

card.appendChild(amountInput);

const pickBtn=document.createElement('button');
pickBtn.type='button';
pickBtn.className='opt';
pickBtn.style.width='100%';
pickBtn.style.marginTop='6px';

pickBtn.textContent=entry.picking
?'✅ Done picking spaces'
:'🎯 Pick space(s) for this entry';

if(entry.picking)pickBtn.classList.add('selected');

pickBtn.addEventListener('click',()=>{
entries.forEach(en=>{
if(en.id!==entry.id)en.picking=false;
});

entry.picking=!entry.picking;
renderEntries();
cbUpdatePreview();
});

card.appendChild(pickBtn);

const spacesLabel=document.createElement('div');
spacesLabel.className='spacesLabel';
spacesLabel.textContent=entry.spaces.length
?`Spaces: ${entry.spaces.join(',')}`
:'';

card.appendChild(spacesLabel);
entriesContainer.appendChild(card);
});
}

function cbSpaceClicked(spaceNum,btn){
const entry=entries.find(en=>en.picking);
if(!entry)return false;

const colorClass=`entryColor${(entry.id%6)||6}`;
const idx=entry.spaces.indexOf(spaceNum);

if(idx!==-1){
entry.spaces.splice(idx,1);
btn.classList.remove('spacePicked',colorClass);
}else{
entry.spaces.push(spaceNum);
btn.classList.add('spacePicked',colorClass);
}

renderEntries();
cbUpdatePreview();
return true;
}

function cbBuildCommand(){
if(entries.length<2)return null;

const e1=entries[0];
const e2=entries[1];

if(!e1.players.length||!e2.players.length)return null;
if(e1.amount===''||e1.amount==null)return null;
if(e2.amount===''||e2.amount==null)return null;

let cmd=`!offer-${e1.players[0]}`;

if(e1.spaces.length)cmd+=` ${e1.spaces.join(',')}`;

cmd+=` money:${e1.amount} ${e2.players[0]} money:${e2.amount}`;

if(e2.spaces.length)cmd+=` ${e2.spaces.join(',')}`;

return cmd;
}

function cbUpdatePreview(){
const cmd=cbBuildCommand();
cbPreview.textContent=cmd||'(select players and enter amounts)';
enterBtn.disabled=!cmd;
}

function cbReset(){
entries.forEach(entry=>{
entry.spaces.forEach(sp=>{
const b=boardSpaceBtns[sp];
if(b)b.classList.remove('spacePicked',`entryColor${(entry.id%6)||6}`);
});
});

entries=[];
nextEntryId=1;

makeEntry('p1');
makeEntry('p2');

renderEntries();
cbUpdatePreview();
}

if(addEntryBtn){
addEntryBtn.addEventListener('click',()=>{
if(entries.length<6){
const players=['p1','p2','p3','p4','p5','p6'];
const used=entries.map(e=>e.players[0]);
const nextPlayer=players.find(p=>!used.includes(p))||'p3';
makeEntry(nextPlayer);
}
});
}

document.getElementById('resetBtn').addEventListener('click',cbReset);

enterBtn.addEventListener('click',()=>{
const cmd=cbBuildCommand();
if(!cmd)return;

socket.emit('sendMessage',{
bot:'player1bot',
msg:cmd
});

const line=document.createElement('div');
line.textContent=`Sent: ${cmd}`;
cmdLog.prepend(line);

cbReset();
});

/* Command Builder board-space click handling */
document.addEventListener('click',e=>{
const btn=e.target.closest('#boardButtons button');
if(!btn)return;

const spaceNum=parseInt(btn.textContent,10);
if(isNaN(spaceNum))return;

boardSpaceBtns[spaceNum]=btn;

cbSpaceClicked(spaceNum,btn);
});

cbReset();

</script>

</body>
</html>
