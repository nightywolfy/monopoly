<!DOCTYPE html>
<html lang="en">
<head>
<title>Trade Menu</title>
<link rel="stylesheet" href="/trade.css">
</head>
<body>
<div id="boardWrapper">
<div id="boardContainer">
<div id="board">
<img id="boardImg" src="map3.png">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="p3" class="piece orange">p3</div>
<div id="p4" class="piece green">p4</div>
<div id="p5" class="piece purple">p5</div>
<div id="p6" class="piece white">p6</div>
<div id="boardButtons"></div>
<div id="centralDisplayContainer">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">P1: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">P2: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">P3: $0</div>
<div id="money-p4-overlay" class="moneyBox green">P4: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">P5: $0</div>
<div id="money-p6-overlay" class="moneyBox white">P6: $0</div>
</div>
</div>
</div>
</div>
</div>
<div id="playerContainer">
<div style="position:relative;width:100%;margin-bottom:20px;display:flex;justify-content:center;align-items:flex-start;">
<div style="position:absolute;left:30px;top:240px;display:flex;flex-direction:column;gap:10px;"></div>
</div>
<div id="buildersRow">
<div id="builder">
<h2>Trade Menu</h2>
<button id="resetBtn" class="small-button" style="width:100%;margin-bottom:8px">RESET</button>
<div style="display:flex;gap:8px;margin-bottom:8px;">
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!accept"><button type="submit" class="small-button">Accept</button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!reject"><button type="submit" class="small-button">Reject</button></form>
<form action="/send-irc" method="POST" target="hiddenFrame"><input type="hidden" name="bot" value="player1bot"><input type="hidden" name="msg" value="!save"><button type="submit" class="small-button">Save</button></form>

</div>
<div class="section">
<div class="section-label">Entries</div>
<div id="entriesContainer"></div>
</div>
<div id="preview">(select players and enter amounts)</div>
<button id="enterBtn" disabled>Enter</button>
</div>
<div id="quickAuctionColumn">
<div id="quickBuilder">
<h2>Quick Command</h2>
<div id="qcCmdRow" class="btn-row"></div>
<div id="qcPlayerRow" class="btn-row player-row"></div>
<div id="qcAmountRow" style="display:none;margin-top:6px">

<input type="number" id="qcAmount" class="amountInput" placeholder="Enter amount..." step="100" min="0">

</div>
<div id="qcPreview" style="margin-top:6px">(select a command and player)</div>
<button id="qcSendBtn" disabled style="width:100%;margin-top:6px">Send</button>
</div>
<div id="auctionBuilder">
<h2>Auction Menu</h2>
<button id="auctionPickBtn" type="button" class="opt" style="width:100%">Pick space for this entry</button>
<div id="auctionSpacesLabel" class="spacesLabel" style="margin-top:6px"></div>
<div id="auctionPreview" style="margin-top:6px">(pick a space to auction)</div>
<button id="auctionSendBtn" disabled style="width:100%;margin-top:6px">Send</button>
</div>
<div id="switchBuilder">
<h2>Switch Menu</h2>
<div id="switchPlayerRow1" class="btn-row player-row"></div>
<div id="switchPlayerRow2" class="btn-row player-row" style="margin-top:6px"></div>
<div id="switchPreview" style="margin-top:6px">(select two players)</div>
<button id="switchSendBtn" disabled style="width:100%;margin-top:6px">Send</button>
</div>
</div>
</div>
<div id="cmdLog"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/trade.js"></script>
</body>
</html>
