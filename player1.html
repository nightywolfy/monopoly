<style>
html,body{margin:0;padding:0;height:100%;width:100%;background:black;font-family:sans-serif;display:flex}
#boardContainer{width:50%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:black}
#board{position:relative;width:900px;height:900px}
#boardImg{width:100%;height:100%}
#boardWrapper{width:50%;height:100%;display:flex;justify-content:center;align-items:center;background:black;overflow:hidden}
.piece{width:32px;height:32px;border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid transparent;box-shadow:0 0 6px rgba(0,0,0,0.4);transition:left 0.4s ease,top 0.4s ease;color:white}
.red{background:#ff4d4d;border-color:#ff8080}
.blue{background:#3399ff;border-color:#66a3ff}
.yellow{background:goldenrod;border-color:#ffde59;color:black}
.green{background:limegreen;border-color:#aaffaa;color:black}
#moneyContainer{display:grid;grid-template-columns:220px;gap:8px;justify-content:center;width:100%;padding:4px 0;box-sizing:border-box;margin:0 auto;transform:translateY(-10px)}
.moneyBox{width:220px;height:60px;padding:6px 8px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;box-shadow:0 0 8px rgba(0,212,255,.6),0 0 12px rgba(106,13,173,.4);border:2px solid rgba(255,255,255,.55);color:black;box-sizing:border-box;overflow:hidden}
.moneyBox.red{background:linear-gradient(135deg,#ff4b4b,#ff9999)} .moneyBox.blue{background:linear-gradient(135deg,#3399ff,#99ddff)}
.hotel,.house{width:29px;height:29px;position:absolute}
#topButtons button:not(.small-button){padding:8px 10px;font-size:1em;font-weight:bold;cursor:pointer;border:none;border-radius:8px;color:#fff}
.small-button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;background:#222;cursor:pointer}
.small-button img{width:100%;height:100%;object-fit:contain}
#controlsContainer{width:50%;height:100%;background:#111;display:flex;flex-direction:column}
#controlsInner{display:flex;flex-direction:column;height:100%;padding:10px;box-sizing:border-box}
#chatFrame{flex-grow:1;width:100%;border:none;min-height:0}
.white-btn.plus{background-color:#28a745!important;border:1px solid #1e7e34!important;color:white!important;padding:.1px .1px;border-radius:3px;font-weight:bold;cursor:pointer}
.white-btn.minus{background-color:#dc3545!important;border:1px solid #b02a37!important;color:white!important;padding:.1px .1px;border-radius:3px;font-weight:bold;cursor:pointer}
.white-btn.plus:hover{background-color:#218838!important}
.white-btn.minus:hover{background-color:#c82333!important}
#centralDisplayContainer{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10}
#displayContainer{display:flex;flex-direction:column;gap:14px;align-items:center}
#display1{position:relative;top:0}
#display2{position:relative;top:0}
.displayBox{padding:15px 20px;border-radius:12px;width:300px;text-align:center;font-weight:bold;font-size:22px;background:linear-gradient(135deg,#6a0dad,#00d4ff);color:white;box-shadow:0 0 12px #6a0dad,0 0 18px #00d4ff;word-wrap:break-word}
#propertyLink,#rulesLink{position:absolute;z-index:20}
#propertyLink img,#rulesLink img{width:75px;border-radius:8px;box-shadow:0 0 6px rgba(255,255,255,.5)}
#propertyLink{top:38%;left:260px;transform:translateY(-50%)}
#rulesLink{top:47%;right:565px;transform:translateY(-50%)}
.dot{width:14px;height:14px;border-radius:50%;position:absolute;z-index:30;border:2px solid black;box-shadow:0 0 1px 1px white}
#modeToggle{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:-7px;z-index:60;position:relative}
.mode-btn{padding:6px 12px;font-size:.9em;border-radius:5px;border:1px solid #555;background:#111;color:#eee;cursor:pointer;text-align:center;transition:.2s}
.mode-btn.active{background:#0077ff!important;color:#fff!important;border-color:#00aaff!important}
.mode-btn:hover{background:#333}
.mode-btn.active:hover{background:#0077ff!important}
</style>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const colorMap = {red:"p1", blue:"p2"};
let currentMap = 2;
let activeDots = {};
let labels = {p1:'Player1',p2:'Player2'};
let lastMoney = {p1:0,p2:0};
let buildingPositions = {};
let lastBuildingsData = null;

function renderDotsFromServer(data){
const board=document.getElementById('board');
if(!data)return;
for(const [num,info] of Object.entries(data)){
if(!info)continue;
if(activeDots[num]){
const el=activeDots[num];
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
}else{
const el=document.createElement('div');
el.className='dot';
el.style.left=info.x+'px';
el.style.top=info.y+'px';
el.style.background=info.color||'#fff';
el.style.zIndex=30;
board.appendChild(el);
activeDots[num]=el;
}
}
}

function updatePieces(data){
if(!data||typeof data!=='object'){console.warn("Pieces data invalid:",data);return;}
const posMap={};
for(const[color,pos]of Object.entries(data)){
if(!pos||typeof pos.x!=="number"||typeof pos.y!=="number"){console.warn("Invalid position for",color,pos);continue;}
const key=`${pos.x},${pos.y}`;
if(!posMap[key])posMap[key]=[];
posMap[key].push(color);
}
for(const[key,colors]of Object.entries(posMap)){
const[baseX,baseY]=key.split(',').map(Number);
colors.forEach((color,idx)=>{
const id=colorMap[color];
if(!id)return;
const el=document.getElementById(id);
if(!el)return;
let offsetX=0,offsetY=0;
if(idx===1){offsetX=10;offsetY=0;}
if(idx===2){offsetX=0;offsetY=10;}
if(idx===3){offsetX=10;offsetY=10;}
el.style.left=(baseX+offsetX)+'px';
el.style.top=(baseY+offsetY)+'px';
el.style.zIndex=20;
});
}
}

// Displays
function updateDisplay1(text){ document.getElementById('display1').innerText = text || ''; }
function updateDisplay2(text){ document.getElementById('display2').innerText = text || ''; }

function renderMoneyBoxes(){
document.getElementById('money-p1-overlay').textContent=labels.p1+': $'+lastMoney.p1;
document.getElementById('money-p2-overlay').textContent=labels.p2+': $'+lastMoney.p2;
}

function updateMoney(data){
lastMoney = {...lastMoney, ...data};
renderMoneyBoxes();
}

function updateLabels(data){
labels = {...labels, ...data};
renderMoneyBoxes();
}

function renderBuildings(data){
const board=document.getElementById('board');
document.querySelectorAll('.house,.hotel').forEach(el=>el.remove());
if(!data)return;
for(const [space,type] of Object.entries(data)){
const pos=buildingPositions[space];
if(!pos)continue;
const isHouse=type.startsWith('house');
const el=document.createElement('img');
el.src=isHouse?`${type}.jpg`:'hotel.jpg';
el.className=isHouse?'house':'hotel';
el.style.position='absolute';
el.style.left=(pos.x-14)+'px';
el.style.top=(pos.y-14)+'px';
el.style.width='29px';
el.style.height='29px';
el.style.zIndex=isHouse?25:26;
board.appendChild(el);
}
}


const group1 = [1,3,4,5,6,8,9,21,22,24,25,26,27,28,29,41,42,44,45,53,56,57];
const group2 = [11,12,13,14,15,16,17,19,31,33,34,35,37,38,39,47,50,51,59,63];
const boardButtonsContainer = document.getElementById('boardButtons');
const modeButtons=document.querySelectorAll('.mode-btn');
let currentMode='mortgage';
modeButtons.forEach(btn=>{
btn.addEventListener('click',()=>{
modeButtons.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentMode=btn.dataset.mode;
boardButtonsContainer.querySelectorAll('button').forEach(b=>{
const spaceNum=b.textContent;
b.title=`${currentMode.charAt(0).toUpperCase()+currentMode.slice(1)} space ${spaceNum}`;
});
});
});

function buildBoardButtons(data){
data.forEach(coords=>{
const spaceNum=coords.number;
const btn=document.createElement('button');
btn.textContent=spaceNum;
btn.style.position='absolute';
btn.style.left=`${coords.x}px`;
btn.style.top=`${coords.y}px`;
if(group1.includes(spaceNum)){btn.style.width='50px';btn.style.height='105px';btn.style.fontSize='0.85em';}
else if(group2.includes(spaceNum)){btn.style.width='105px';btn.style.height='50px';btn.style.fontSize='0.75em';}
else{btn.style.width='110px';btn.style.height='110px';btn.style.fontSize='0.8em';}
btn.style.backgroundColor='transparent';
btn.style.border='none';
btn.style.color='transparent';
btn.style.zIndex=100;
btn.style.cursor='pointer';
btn.style.pointerEvents='auto';
btn.addEventListener('click',()=>socket.emit('sendMessage',{bot:'player1bot',msg:`!${currentMode} ${spaceNum}`}));
boardButtonsContainer.appendChild(btn);
});
}

function scaleBoard(){
const container=document.getElementById('boardContainer');
const wrapper=document.getElementById('boardWrapper');
const scaleX=wrapper.clientWidth/930;
const scaleY=wrapper.clientHeight/930;
const scale=Math.min(scaleX,scaleY);
container.style.transform=`scale(${scale})`;
}

window.addEventListener('resize',scaleBoard);
scaleBoard();
if(!window.__SOUND_LISTENER_LOCK__){
window.__SOUND_LISTENER_LOCK__=true;
socket.on('play-sound',({file})=>{
new Audio(file).play();
});
console.log("Sound listener attached (single instance)");
}

document.addEventListener("DOMContentLoaded",()=>{
document.querySelectorAll('form[target="hiddenFrame"]').forEach(form=>{
form.addEventListener("submit",function(e){
e.preventDefault();
const bot=form.querySelector('[name="bot"]').value;
const msg=form.querySelector('[name="msg"]').value;
const targetInput=form.querySelector('[name="target"]');
const target=targetInput?.value||undefined;
fetch(form.action,{method:form.method||"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bot,target,msg})}).catch(err=>console.error(err));
});
});
});

socket.on('piecesUpdate', updatePieces);
socket.on('draw-dot', info => { renderDotsFromServer({[info.num]: info}); });
socket.on('map-change', n => document.getElementById('boardImg').src = `map${n}.png`);
socket.on('reload-dots', data => { renderDotsFromServer(data); });
socket.on('displayUpdate1', data=>updateDisplay1(data.text));
socket.on('displayUpdate2', data=>updateDisplay2(data.text));
socket.on('moneyUpdate', updateMoney);
socket.on('labelsUpdate', updateLabels);
socket.on('buildingsUpdate', data=>{ lastBuildingsData=data; renderBuildings(data); });
socket.on('buildingPositions', data=>{ buildingPositions=data; renderBuildings(lastBuildingsData); });
socket.on('boardClickPositions', data=>{ buildBoardButtons(data); });
socket.on('remove-dot',n=>{if(activeDots[n]){activeDots[n].remove();delete activeDots[n];}});
socket.on('clear-all-dots',()=>{Object.values(activeDots).forEach(e=>e.remove());activeDots={};});
socket.on('clickableSpacesData', data => { buildBoardButtons(data); });
// Initial fetch
fetch('/pieces.json').then(res=>res.json()).then(updatePieces);
fetch('/display1.json').then(res=>res.json()).then(data=>updateDisplay1(data.text));
fetch('/display2.json').then(res=>res.json()).then(data=>updateDisplay2(data.text));
fetch('/money.json').then(res=>res.json()).then(updateMoney);
fetch('/labels.json').then(res=>res.json()).then(updateLabels).catch(()=>{});
fetch('/building.json').then(r=>r.json()).then(data=>{ lastBuildingsData=data; renderBuildings(data); });
</script>
