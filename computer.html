<!DOCTYPE html>
<html lang="en">
<head>
<title>Monopoly</title>
<link rel="stylesheet" href="/computer.css">
</head>
<body data-bot="player1bot">
<div id="boardWrapper">
<div id="boardContainer">
<div id="board">
<img id="boardImg" src="map2.png" alt="Monopoly Board">
<div id="p1" class="piece red">p1</div>
<div id="p2" class="piece blue">p2</div>
<div id="p3" class="piece orange">p3</div>
<div id="p4" class="piece green">p4</div>
<div id="p5" class="piece purple">p5</div>
<div id="p6" class="piece white">p6</div>
<div id="boardButtons"></div>
<div id="centralDisplayContainer">
<div id="topButtons">
<div class="buttonRow">
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!dice0-p1"><img src="dice.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!dice4-p1"><img src="jail.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!jailpay p1"><img src="key.png"></button>
<a id="tradeLink" href="trade.html?p=1" target="_blank"><button type="button" class="small-button"><img src="p1.png"></button></a>
</div>
<div class="buttonRow">
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 5"><img src="5.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 10"><img src="10.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 25"><img src="25.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!bidadd 50"><img src="50.png"></button>
<button type="button" class="small-button" data-target="rentobot" data-from="player1bot" data-msg="!fold"><img src="fold.png"></button>
</div>
</div>
<div id="displayContainer">
<div id="display1" class="displayBox">Display 1</div>
<div id="display2" class="displayBox">Display 2</div>
</div>
</div>
</div>
<div id="modeToggle">
<button type="button" class="mode-btn active" data-mode="mortgage">Mortgage</button>
<button type="button" class="mode-btn" data-mode="redeem">Redeem</button>
<button type="button" class="mode-btn" data-mode="addonehouse">AddHouse</button>
<button type="button" class="mode-btn" data-mode="removeonehouse">RemoveHouse</button>
</div>
</div>
</div>
<div id="controlsContainer">
<div id="controlsInner">
<div id="moneyContainer">
<div id="money-p1-overlay" class="moneyBox red">Player1: $0</div>
<div id="money-p3-overlay" class="moneyBox orange">Player3: $0</div>
<div id="money-p5-overlay" class="moneyBox purple">Player5: $0</div>
<div id="money-p2-overlay" class="moneyBox blue">Player2: $0</div>
<div id="money-p4-overlay" class="moneyBox green">Player4: $0</div>
<div id="money-p6-overlay" class="moneyBox white">Player6: $0</div>
</div>
<div id="chatBox">
<div id="chatMessages"></div>
<div id="chatInputRow">
<input id="chatInput" type="text" placeholder="Type a message..." maxlength="250" autocomplete="off">
<button id="chatSend" type="button">Send</button>
</div>
</div>
</div>
</div>
<script>
(function(){
const p=Math.min(6,Math.max(1,parseInt(new URLSearchParams(location.search).get("p"))||1)),
bot=`player${p}bot`;
document.body.dataset.bot=bot;
document.querySelectorAll("[data-from]").forEach(e=>e.dataset.from=bot);
document.querySelector('[data-msg="!dice0-p1"]').dataset.msg=`!dice0-p${p}`;
document.querySelector('[data-msg="!dice4-p1"]').dataset.msg=`!dice4-p${p}`;
document.querySelector('[data-msg="!jailpay p1"]').dataset.msg=`!jailpay p${p}`;
document.querySelector('img[src="p1.png"]').src=`p${p}.png`;
const t=document.getElementById("tradeLink");
if(t)t.href=`trade.html?p=${p}`;
})();
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="/javascript.js"></script>
<script src="/pieces.js"></script>
<script src="/money.js"></script>
<script src="/display.js"></script>
<script src="/scaleboard.js"></script>
<script src="/buttons.js"></script>
<script src="/chat.js"></script>
<script src="/sound.js"></script>
</body>
</html>
